# Git hooks (adopted from the sun-nextjs-template). Installed by the package.json
# postinstall script; skipped on CI (postinstall guards on !process.env.CI).
# Keeps ESLint — does NOT switch to Biome.
pre-commit:
  parallel: false
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      # Sungen-generated runtime/specs are auto-generated and eslint-ignored
      # (see eslint.config.mjs); don't hand them to eslint --fix.
      exclude: "specs/generated/"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck
